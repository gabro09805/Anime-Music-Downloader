services:
  anime-music:
    build: .
    container_name: anime_music_downloader
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DOWNLOAD_DIR=/downloads
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./downloads:/downloads
    restart: unless-stopped